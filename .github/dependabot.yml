# 라이브러리(npm)와 배포 도구(GitHub Actions)에 보안 업데이트가 나오면
# 매주 자동으로 업데이트 제안(Pull Request)을 만들어 줍니다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
